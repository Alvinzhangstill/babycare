services:
  babycare:
    build:
      context: .
      dockerfile: Dockerfile
    image: babycare:latest
    container_name: babycare
    restart: unless-stopped
    ports:
      # 将服务器的 8080 端口映射到容器的 80 端口
      # 如需使用 80 端口，改为 "80:80"
      - "8080:80"
    # 如需配置 HTTPS，取消下面注释并配置证书路径
    # volumes:
    #   - /path/to/ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
    #   - /path/to/ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    # environment:
    #   - DOMAIN=your-domain.com
